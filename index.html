<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrega de Guías | Diaz Rodriguez Iker Andreu</title>
    <!-- Fuente moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de color para fácil personalización */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --btn-bg: rgba(51, 65, 85, 0.6);
        }

        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Tarjeta principal */
        main {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px;
            background: linear-gradient(to right, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nombre {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: capitalize; /* Pone en mayúscula la 'A' de Andreu automáticamente */
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
        }

        /* Contenedor de botones */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Estilo de cada botón */
        .btn-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            background-color: var(--btn-bg);
            border: 1px solid var(--card-border);
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Flecha decorativa a la derecha del botón */
        .btn-link::after {
            content: '→';
            font-size: 1.2rem;
            color: var(--accent);
            transition: transform 0.25s ease;
        }

        /* Efecto al pasar el mouse */
        .btn-link:hover {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.4);
        }

        .btn-link:hover::after {
            transform: translateX(5px);
        }

        /* Efecto al hacer clic */
        .btn-link:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <main>
        <h1>Entrega de Guías</h1>
        <p class="nombre">Diaz Rodriguez Iker andreu</p>

        <div class="links-container">
            <a href="Santa-rosa-Diaz-guia1/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 1</a>

            <a href="Santa-rosa-Diaz-guia2/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 2</a>

            <a href="Santa-rosa-Diaz-guia3/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 3</a>

            <a href="santa-rosa-Diaz-guia4/index.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 4</a>

            <a href="santa-rosa-Diaz-guia5/index-bootstrap.html" class="btn-link" target="_blank" rel="noopener noreferrer">Ver Guía 5</a>
        </div>
    </main>
</body>

</html>
